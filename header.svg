<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#050B1A" />
<stop offset="1" stop-color="#0B2A4A" />
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#38E1FF" stroke-opacity=".09" />
</pattern>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#38E1FF" stop-opacity="0" />
<stop offset=".5" stop-color="#38E1FF" stop-opacity=".18" />
<stop offset="1" stop-color="#38E1FF" stop-opacity="0" />
</linearGradient>
<clipPath id="reveal">
<rect x="0" y="0" height="320" width="0">
<animate attributeName="width" values="0;1000;1000;0" keyTimes="0;.35;.92;1" dur="8s" repeatCount="indefinite" />
</rect>
</clipPath>
</defs>
<style>
text{font-family:"Courier New",Courier,monospace}
.scan{animation:scan 4s linear infinite}
@keyframes scan{0%{transform:translateY(-60px)}100%{transform:translateY(340px)}}
.g1{animation:g1 3.5s infinite steps(1);opacity:0}
@keyframes g1{0%,88%,100%{transform:translate(0,0);opacity:0}90%{transform:translate(-6px,2px);opacity:.85}94%{transform:translate(5px,-2px);opacity:.85}97%{transform:translate(-2px,0);opacity:.6}}
.g2{animation:g2 3.5s infinite steps(1);opacity:0}
@keyframes g2{0%,89%,100%{transform:translate(0,0);opacity:0}91%{transform:translate(6px,-2px);opacity:.85}95%{transform:translate(-5px,2px);opacity:.85}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.f1{animation:fl 5s ease-in-out infinite alternate}
.f2{animation:fl 7s ease-in-out infinite alternate-reverse}
.f3{animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-22px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
</style>

<rect width="1000" height="320" fill="url(#bg)" />
<rect width="1000" height="320" fill="url(#grid)" />

<g fill="#38E1FF">
<rect class="f1" x="90" y="230" width="10" height="10" opacity=".55" />
<rect class="f2" x="880" y="70" width="14" height="14" opacity=".4" />
<rect class="f3" x="780" y="250" width="8" height="8" opacity=".6" />
<rect class="f2" x="170" y="60" width="8" height="8" opacity=".5" />
<rect class="f1" x="930" y="200" width="10" height="10" opacity=".45" />
<rect class="f3" x="450" y="40" width="6" height="6" opacity=".5" />
</g>

<rect class="scan" x="0" y="0" width="1000" height="60" fill="url(#beam)" />

<g stroke="#38E1FF" stroke-width="3" fill="none" class="pulse">
<path d="M24 60V24H60" />
<path d="M940 24H976V60" />
<path d="M24 260V296H60" />
<path d="M976 260V296H940" />
</g>

<text x="500" y="62" text-anchor="middle" font-size="14" fill="#38E1FF" letter-spacing="6" opacity=".8">[ PLAYER 01 // ONLINE ]</text>

<g text-anchor="middle" font-weight="700" font-size="96" letter-spacing="8">
<text class="g1" x="500" y="175" fill="#FF4D8D">DAFZ</text>
<text class="g2" x="500" y="175" fill="#38E1FF">DAFZ</text>
<text x="500" y="175" fill="#E8F6FF">DAFZ</text>
</g>

<g clip-path="url(#reveal)">
<text x="500" y="218" text-anchor="middle" font-size="22" fill="#38E1FF" letter-spacing="7">CREATIVE FRONTEND DEVELOPER</text>
</g>

<text class="blink" x="500" y="275" text-anchor="middle" font-size="20" fill="#E8F6FF" letter-spacing="8">▶ PRESS START</text>
</svg>