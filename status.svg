<svg width="1000" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#07101F"/>
<stop offset="1" stop-color="#0B2340"/>
</linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1B8FB5"/>
<stop offset="1" stop-color="#38E1FF"/>
</linearGradient>
</defs>
<style>
text{font-family:"Courier New",Courier,monospace;fill:#E8F6FF}
.dim{fill:#7FA6C2}
.b{transform-box:fill-box;transform-origin:0 50%;animation:grow 2.2s cubic-bezier(.2,.8,.2,1) both}
.b2{animation-delay:.2s}.b3{animation-delay:.4s}.b4{animation-delay:.6s}.b5{animation-delay:.8s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.avatar{animation:bob 2.5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
</style>

<rect x="2" y="2" width="996" height="376" rx="6" fill="url(#card)" stroke="#38E1FF" stroke-opacity=".6" stroke-width="2"/>
<rect x="14" y="14" width="972" height="352" rx="3" fill="none" stroke="#38E1FF" stroke-opacity=".18"/>

<text x="40" y="52" font-size="16" letter-spacing="5" fill="#38E1FF" style="fill:#38E1FF">&#9670; PLAYER STATUS</text>
<line x1="40" y1="66" x2="960" y2="66" stroke="#38E1FF" stroke-opacity=".35"/>

<!-- avatar -->
<g class="avatar">
<rect x="70" y="110" width="170" height="170" fill="#0E3556" stroke="#38E1FF" stroke-width="2"/>
<g fill="#38E1FF" class="glow">
<rect x="130" y="135" width="50" height="50"/>
<rect x="110" y="195" width="90" height="14"/>
<rect x="100" y="215" width="110" height="46"/>
</g>
<rect x="140" y="150" width="10" height="10" fill="#050B1A"/>
<rect x="160" y="150" width="10" height="10" fill="#050B1A"/>
</g>
<text x="155" y="312" text-anchor="middle" font-size="20" font-weight="700">DAFA ARDI</text>
<text class="dim" x="155" y="336" text-anchor="middle" font-size="13">Class: Frontend Mage</text>

<!-- info -->
<text class="dim" x="300" y="106" font-size="14">GUILD</text>
<text x="400" y="106" font-size="14">Sistem Informasi</text>
<text class="dim" x="300" y="130" font-size="14">LEVEL</text>
<text x="400" y="130" font-size="14">&#8734; (always leveling up)</text>
<text class="dim" x="300" y="154" font-size="14">QUEST</text>
<text x="400" y="154" font-size="14">Build, ship, repeat<tspan class="blink">_</tspan></text>

<!-- bars -->
<g font-size="14">
<text class="dim" x="300" y="206">FRONTEND</text>
<rect x="450" y="193" width="440" height="14" fill="#0E3556"/>
<rect class="b" x="450" y="193" width="396" height="14" fill="url(#bar)"/>
<text x="900" y="206">90</text>

<text class="dim" x="300" y="236">UI / UX</text>
<rect x="450" y="223" width="440" height="14" fill="#0E3556"/>
<rect class="b b2" x="450" y="223" width="343" height="14" fill="url(#bar)"/>
<text x="900" y="236">78</text>

<text class="dim" x="300" y="266">ANIMATION</text>
<rect x="450" y="253" width="440" height="14" fill="#0E3556"/>
<rect class="b b3" x="450" y="253" width="387" height="14" fill="url(#bar)"/>
<text x="900" y="266">88</text>

<text class="dim" x="300" y="296">DEBUGGING</text>
<rect x="450" y="283" width="440" height="14" fill="#0E3556"/>
<rect class="b b4" x="450" y="283" width="264" height="14" fill="url(#bar)"/>
<text x="900" y="296">60</text>

<text class="dim" x="300" y="326">COFFEE (MP)</text>
<rect x="450" y="313" width="440" height="14" fill="#0E3556"/>
<rect class="b b5" x="450" y="313" width="308" height="14" fill="#FF4D8D"/>
<text x="900" y="326">70</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
